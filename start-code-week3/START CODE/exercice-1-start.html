<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body {
            background-color: pink;
            margin: 0;
            padding-left: 10em;
            padding-right: 10em;
            height: 100vh;
        }

        .container {
            background-color: greenyellow;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1em;
        }
      header {
        background: grey;
        height: 100px;
      }
      footer {
        background: grey;
        height: 100px;
      }

      main {
        background: grey;
        flex-grow : 1;
      }
 
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>Main</main>
      <footer>Footer</footer>
      </section>
    </div>
  </body>
</html>
